name: Identra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: identra_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identra_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode clean verify
        env:
          DB_PASSWORD: ci-test-password
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          DB_URL: jdbc:postgresql://localhost:5432/identra_db
          DB_USERNAME: postgres

      - name: Diagnose migration and database state
        if: always()
        run: |
          echo "=== Migration resources ==="
          find src/main/resources/db/migration -type f -print
          find target -path '*db/migration*' -type f -print || true

          echo "=== Flyway and Hibernate errors ==="
          grep -R -n -i -E 'Flyway|Migrating schema|Successfully applied|Successfully baselined|refresh_tokens|Schema validation' target/surefire-reports || true